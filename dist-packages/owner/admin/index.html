<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EONIX GAMES — Owner Dashboard</title><link rel="stylesheet" href="../css/site.css"><style>
*{box-sizing:border-box}body{background:#0b0912;color:#f7f4ff;font:16px Arial,sans-serif}.wrap{max-width:1050px;margin:32px auto;padding:16px}.box{background:#151220;border:1px solid #40345a;border-radius:12px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}input,textarea,select{width:100%;padding:11px;background:#09070d;color:white;border:1px solid #554575;border-radius:6px;margin:6px 0 12px}button,.button{background:#7952d8;color:white;border:0;border-radius:6px;padding:11px 15px;cursor:pointer;margin:4px}button.secondary{background:#332747}button.red{background:#8e334c}label{display:block;color:#d5cae8}.item{border-top:1px solid #393044;padding:12px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:#b8adc8}.hide{display:none!important}#login{max-width:430px;margin:10vh auto}img.thumb{max-width:130px;max-height:90px;object-fit:cover}
</style></head><body><main class="wrap"><header class="box"><h1>EONIX GAMES <span class="muted">Owner Dashboard</span></h1><p class="muted">Private, local editing workspace. Changes are stored in this browser.</p></header>
<section id="login" class="box"><h2>Sign in</h2><label>Username<input id="user" autocomplete="username"></label><label>Password<input id="pass" type="password" autocomplete="current-password"></label><button id="signin">Sign in</button><p id="loginMsg" class="muted"></p><small>First login: said / said</small></section>
<section id="app" class="hide"><nav class="box"><button data-view="games">Games</button><button data-view="articles">Articles</button><button data-view="launch">Game Launch</button><button data-view="export">Backup & Export</button><button id="logout" class="secondary">Sign out</button></nav><div id="content"></div></section></main>
<script src="../data/site-data.js"></script><script src="../js/render.js"></script><script>
(function(){'use strict';var $=function(s){return document.querySelector(s)},db,items={games:[],articles:[],launch:{}},view='games',editing=-1;
function openDB(){return new Promise(function(ok,no){var r=indexedDB.open('eonix-owner-v1',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv')};r.onsuccess=function(){db=r.result;ok()};r.onerror=function(){no(r.error)}})}
function load(){return new Promise(function(ok){var t=db.transaction('kv','readonly'),r=t.objectStore('kv').get('data');r.onsuccess=function(){items=r.result||JSON.parse(JSON.stringify(window.EONIX_DATA||{games:[],articles:[],launch:{enabled:false}}));ok()};r.onerror=function(){ok()}})}
function save(){return new Promise(function(ok,no){var t=db.transaction('kv','readwrite');t.objectStore('kv').put(items,'data');t.oncomplete=ok;t.onerror=function(){no(t.error)}})}
function init(){openDB().then(load).then(function(){$('#login').classList.add('hide');$('#app').classList.remove('hide');render()}).catch(function(e){alert('Storage unavailable: '+e.message)})}
var auth=localStorage.getItem('eonix-owner-login');if(!auth){auth=JSON.stringify({u:'said',p:'said'});localStorage.setItem('eonix-owner-login',auth)}
$('#signin').onclick=function(){var a=JSON.parse(localStorage.getItem('eonix-owner-login'));if($('#user').value===a.u&&$('#pass').value===a.p){sessionStorage.setItem('eonix-owner-ok','1');init()}else $('#loginMsg').textContent='Wrong username or password.'};$('#logout').onclick=function(){sessionStorage.removeItem('eonix-owner-ok');location.reload()};
document.querySelector('nav').onclick=function(e){if(e.target.dataset.view){view=e.target.dataset.view;editing=-1;render()}};if(sessionStorage.getItem('eonix-owner-ok'))init();
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function render(){var c=$('#content');if(view==='games'||view==='articles'){var arr=items[view]||(items[view]=[]),label=view==='games'?'Game':'Article';c.innerHTML='<section class="box"><h2>'+view+'</h2><button id="add">Add '+label+'</button><div id="list"></div></section><section id="form" class="box hide"></section>';var list=$('#list');arr.forEach(function(x,i){var title=(x.title&& (x.title.en||x.title))||x.slug||x.title||label;list.innerHTML+='<div class="item"><span>'+esc(title)+' <small class="muted">'+(x.published?'Published':'Draft')+'</small></span><span><button data-edit="'+i+'">Edit</button><button class="red" data-del="'+i+'">Delete</button></span></div>'});$('#add').onclick=function(){editing=-1;form()};list.onclick=function(e){if(e.target.dataset.edit!==undefined){editing=+e.target.dataset.edit;form()}if(e.target.dataset.del!==undefined&&confirm('Delete this item?')){arr.splice(+e.target.dataset.del,1);save().then(render)}};return}if(view==='launch'){c.innerHTML='<section class="box"><h2>Game Launch</h2><label>Enable launch feature<input id="enabled" type="checkbox" '+(items.launch.enabled?'checked':'')+'></label><label>Title<input id="launchTitle" value="'+esc(items.launch.title)+'"></label><label>English text<textarea id="launchText">'+esc(items.launch.text&&items.launch.text.en)+'</textarea></label><label>Arabic text<textarea id="launchAr">'+esc(items.launch.text&&items.launch.text.ar)+'</textarea></label><button id="saveLaunch">Save launch settings</button></section>';$('#saveLaunch').onclick=function(){items.launch=items.launch||{};items.launch.enabled=$('#enabled').checked;items.launch.title=$('#launchTitle').value;items.launch.text={en:$('#launchText').value,ar:$('#launchAr').value};save().then(function(){alert('Saved')})};return}c.innerHTML='<section class="box"><h2>Backup & Export</h2><p>Download the private backup or generate a public ZIP with published content only.</p><button id="backup">Download backup JSON</button><button id="public">Export public website ZIP</button><label>Change dashboard password<input id="newPass" type="password"></label><button id="changePass">Save password</button><p class="muted">The dashboard is local-only. Export and upload the public ZIP to publish updates.</p></section>';$('#backup').onclick=function(){download(new Blob([JSON.stringify(items,null,2)],{type:'application/json'}),'EONIX_OWNER_BACKUP.json')};$('#public').onclick=exportPublic;$('#changePass').onclick=function(){var p=$('#newPass').value;if(p.length<6){alert('Use at least 6 characters');return}var a=JSON.parse(localStorage.getItem('eonix-owner-login'));a.p=p;localStorage.setItem('eonix-owner-login',JSON.stringify(a));alert('Password changed')};}
function form(){var arr=items[view],x=editing<0?{}:arr[editing],isGame=view==='games',f=$('#form');f.classList.remove('hide');f.innerHTML='<h2>'+(editing<0?'Add':'Edit')+' '+(isGame?'game':'article')+'</h2><div class="grid"><label>Slug<input id="slug" value="'+esc(x.slug)+'"></label><label>English title<input id="titleEn" value="'+esc(x.title&&x.title.en||x.title)+'"></label><label>Arabic title<input id="titleAr" value="'+esc(x.title&&x.title.ar)+'"></label>'+(isGame?'<label>Platform<select id="platform"><option>PC</option><option>Mobile</option><option>PC & Mobile</option></select></label><label>Status<input id="status" value="'+esc(x.status||'In Development')+'"></label>':'<label>Date<input id="date" value="'+esc(x.date)+'"></label>')+'<label>Cover image path or URL<input id="cover" value="'+esc(x.cover)+'"></label>'+(isGame?'<label>Banner image path or URL<input id="banner" value="'+esc(x.banner)+'"></label>':'')+'</div><label>Short description (English)<textarea id="shortEn">'+esc(x.short&&x.short.en)+'</textarea></label><label>Short description (Arabic)<textarea id="shortAr">'+esc(x.short&&x.short.ar)+'</textarea></label><label>Full description (English)<textarea id="fullEn">'+esc(x.full&&x.full.en)+'</textarea></label><label>Full description (Arabic)<textarea id="fullAr">'+esc(x.full&&x.full.ar)+'</textarea></label><label><input id="published" type="checkbox" '+(x.published?'checked':'')+'> Published</label><button id="saveItem">Save</button><button id="cancel" class="secondary">Cancel</button>';if(x.platform)$('#platform').value=x.platform;$('#saveItem').onclick=function(){var slug=$('#slug').value.trim().toLowerCase().replace(/[^a-z0-9-]+/g,'-');if(!slug){alert('Enter a slug');return}var short={en:$('#shortEn').value,ar:$('#shortAr').value};var data=Object.assign({},x,{id:x.id||slug,slug:slug,title:{en:$('#titleEn').value,ar:$('#titleAr').value},short:short,shortDescription:short,full:{en:$('#fullEn').value,ar:$('#fullAr').value},cover:$('#cover').value,published:$('#published').checked});if(isGame){data.platform=$('#platform').value;data.status=$('#status').value;data.banner=$('#banner').value}else data.date=$('#date').value;if(editing<0)arr.push(data);else arr[editing]=data;save().then(render)};$('#cancel').onclick=render}
function download(blob,name){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},2000)}
function exportPublic(){
var state={games:items.games.filter(function(x){return x.published}),articles:items.articles.filter(function(x){return x.published}),launch:items.launch};
var generated=window.EonixGen.buildFiles(state,{res:function(x){return x},siteUrl:'',md:window.EonixGen.plainMd});
var z=new JSZip(),shell=['index.html','css/site.css','js/site.js','js/render.js','assets/images/brand/eonix-games-logo.png'];
var refs=[];state.games.forEach(function(g){[g.cover,g.banner].concat(g.shots||[]).forEach(function(x){if(x&&/^(assets\/|\.\.\/)/.test(x))refs.push(x.replace(/^\.\.\//,''))})});state.articles.forEach(function(a){if(a.cover&&/^(assets\/|\.\.\/)/.test(a.cover))refs.push(a.cover.replace(/^\.\.\//,''))});if(state.launch&&state.launch.image&&/^(assets\/|\.\.\/)/.test(state.launch.image))refs.push(state.launch.image.replace(/^\.\.\//,''));
shell=Array.from(new Set(shell.concat(refs)));Promise.all(shell.map(function(p){return fetch('../'+p).then(function(r){if(!r.ok)throw Error('Could not load '+p);return r.blob()}).then(function(b){z.file(p,b)})})).then(function(){generated.files.forEach(function(f){z.file(f.path,f.text)});return z.generateAsync({type:'blob'})}).then(function(b){download(b,'EONIX_GAMES_PUBLIC_WEBSITE.zip');alert('Public website ZIP exported.')}).catch(function(e){alert('Export failed: '+e.message)})
}
})();
</script><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script></body></html>
